<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef3f8;
            color: #1f2d3d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .tarjeta {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(30, 58, 138, .12);
        }
        .tarjeta h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .sub { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px; }
        form label { display: block; margin-bottom: 14px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        .btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s;
        }
        .btn:hover { opacity: .85; }
        .btn-primario { background: #2563eb; color: #fff; margin-top: 6px; }
        .pie { text-align: center; margin-top: 16px; font-size: 14px; color: #455a73; }
        .pie a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .alerta { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
        .alerta.exito { background: #dcfce7; color: #166534; }
        .alerta.error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Agencia de Boletos</h1>
        <p class="sub">Crea tu cuenta</p>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alerta {{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/registro">
            <label>Nombre completo
                <input type="text" name="nombre" placeholder="Tu nombre" required>
            </label>
            <label>Correo electrónico
                <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </label>
            <label>Contraseña
                <input type="password" name="password" placeholder="Crea una contraseña" required>
            </label>
            <label>Confirmar contraseña
                <input type="password" name="confirmar" placeholder="Repite la contraseña" required>
            </label>
            <button type="submit" class="btn btn-primario">Registrarme</button>
        </form>

        <div class="pie">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
